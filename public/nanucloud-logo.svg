<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" fill="none">
  <!-- Green Cloud Body with Left Swoosh/Arrow -->
  <path 
    d="M 120 230 C 70 230 35 195 35 150 C 35 105 70 70 120 70 C 135 70 148 74 160 80 C 180 45 220 25 265 25 C 325 25 375 65 385 125 C 400 125 415 132 425 145" 
    stroke="#00A859" 
    stroke-width="16" 
