  <rect x="470" y="15" width="22" height="22" rx="2" fill="#00A859" />
  <rect x="495" y="45" width="36" height="36" rx="3" fill="#00A859" />
  <rect x="430" y="110" width="25" height="25" rx="2" fill="#00A859" />
  <rect x="392" y="160" width="28" height="28" rx="2" fill="#00A859" />

  <!-- Wordmark "Nanu" -->
  <text x="105" y="175" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="92" fill="#18181B" letter-spacing="-2">Nanu</text>

  <!-- Wordmark "CLOUD" -->
